# =====================================================================
#  Gold intraday backtester - configuration
#  Stage 1 uses `data` + `quality`, Stage 2 `prepare`, Stage 3 `strategy`
#  and `research`. Report settings get added in later stages.
# =====================================================================

data:
  instrument: xauusd
  start_date: "2019-01-01"
  end_date: null              # null = today (UTC)

  raw_dir: data/raw           # yearly CSV chunks land in data/raw/<bid|ask>/<year>/
  processed_file: data/processed/xauusd_m1.parquet

  # dukascopy-node reports volume in "millions" by default, which gives tiny
  # numbers for gold (e.g. 0.0012). We ask for plain "units" so that the
  # later "if volume is 0 or missing, use 1" rule is a sensible fallback
  # rather than a weight thousands of times bigger than a normal bar.
  volume_units: units

  # Dukascopy reports separate bid-side and ask-side tick volume.
  # Which one becomes the single `volume` column used for VWAP:
  #   bid | ask | sum | mean
  volume_source: bid

  download_retries: 3         # per-file retries inside dukascopy-node
  chunk_attempts: 2           # whole-chunk attempts before giving up on a year

quality:
  report_timezone: Europe/London
  # Window we care most about (UK time). Missing minutes in here are reported per day.
  session_start: "13:00"
  session_end: "17:00"
  # Outside the session, only gaps at least this long are listed individually.
  large_gap_minutes: 30
  report_dir: reports

prepare:
  timezone: Europe/London
  bar_minutes: 5
  m5_file: data/processed/xauusd_m5.parquet

# ---------------------------------------------------------------------
#  Strategy - names and defaults copied from the Pine script inputs
#  (reference/ny_session_map.pine). All times are UK time, bar OPEN times.
# ---------------------------------------------------------------------
strategy:
  session: ["13:00", "17:00"]        # sessStr   "1300-1700"
  opening_range: ["13:30", "14:00"]  # orStr     (plotting only)
  entry_window: ["13:30", "16:30"]   # entryStr  "1330-1630"
  inner_mult: 1.0                    # innerMult  inner band (SD)
  outer_mult: 2.0                    # outerMult  outer band (SD)
  trend_pct: 80                      # trendPct
  min_bars: 6                        # minBars
  touch_tol: 0.25                    # touchTol   VWAP touch tolerance (SD)
  cooldown: 3                        # cooldown   signal needs > 3 bars since last
  flip_dist: 0.5                     # flipDist   "lost" = close beyond VWAP by x SD
  use_pb: false                      # usePB  (off in your TradingView: "they were all negative")
  use_fade: true                     # useFade
  use_flip: true                     # useFlip
  max_trades: 3                      # maxTrades  per day (your TradingView; script default 2)
  pb_rr: 2.0                         # pbRR       (your TradingView; script default 3)
  flip_rr: 2.0                       # flipRR     (your TradingView; script default 3)
  use_fixed_tp: true                 # useFixedTP (false = PB/Flip trail only)
  fade_target: band                  # fadeTgt: band (opposite 1 SD band) | vwap
  fade_min_rr: 1.0                   # fadeMinRR
  fade_lookback: 5                   # fadeLook   bars, includes the signal bar
  atr_len: 14                        # atrLen     Wilder ATR on all 5-min bars
  stop_buf: 0.1                      # stopBuf    x ATR
  risk_pct: 1.0                      # riskPct
  use_be: true                       # useBE
  be_r: 1.0                          # beR
  use_trail: true                    # useTrail
  trail_start: 1.0                   # trailStart (R) (your TradingView; script default 1.5)
  trail_atr: 2.0                     # trailATR   (x ATR)

# ---------------------------------------------------------------------
#  Opening-range breakout (ORB) - a separate strategy idea. Rules fixed
#  BEFORE testing (5 Nov 2026); see src/orb.py. Not to be tuned on results.
# ---------------------------------------------------------------------
orb:
  range: ["13:30", "14:00"]     # opening range = high/low of bars opening 13:30-13:55
  last_signal: "16:30"          # signal bar must open before this (last = 16:25)
  exit_time: "17:00"            # exit at the open of the 17:00 bar if not stopped
  min_range_bars: 5             # need at least 5 of the 6 range bars

# ---------------------------------------------------------------------
#  Multi-day trend following (rules fixed 5 Nov 2026, see src/trend.py)
# ---------------------------------------------------------------------
daily:
  start_date: "2004-01-01"      # as far back as Dukascopy has it; actual start is reported
  raw_dir: data/raw_d1
  processed_file: data/processed/xauusd_d1.parquet

trend:
  lookbacks: [50, 100, 200]     # long above the N-day average, short below; one third each
  atr_len: 20                   # daily ATR used for sizing
  risk_pct_per_atr: 1.0         # full position: a 1-ATR day = 1% of the starting balance
  # Overnight financing on the position's value, per year. ROUGH typical CFD /
  # spread-bet figures: check your broker's actual rates and put them here.
  financing_long_pct: 6.0
  financing_short_pct: 1.0

research:
  # Everything from this date on is out-of-sample and LOCKED: run_backtest.py
  # cuts the data off before it until you set oos_locked: false (once!).
  oos_start: "2024-01-01"
  oos_locked: true
  # The ONLY out-of-sample dates that may be used while locked: your TradingView
  # export, for the Stage 5 logic check (never for tuning). 10 days before the
  # start are also loaded, only so ATR is warmed up, and not reported.
  validation_windows:
    - ["2026-10-11", "2026-11-05"]

# ---------------------------------------------------------------------
#  Decisions recorded now, used from Stage 3/4 onwards
# ---------------------------------------------------------------------
execution:
  # realistic   - real bid/ask fills, 1-minute data decides stop vs target,
  #               position size capped at max_leverage x equity.
  # tradingview - copies TradingView's broker emulator, for Stage 5 validation:
  #               fills on the bid (chart) price + commission, guesses the path
  #               inside a 5-minute bar from its OHLC (no bar magnifier), no size
  #               cap: an over-margined entry from flat is rejected, a flip that
  #               reverses a position is filled then margin-called (4x shortfall).
  mode: realistic
  max_leverage: 20                  # 5% margin, FCA retail limit for gold
  commission_per_oz_per_side: 0.0   # tradingview mode uses 0.15 like the Pine script
  initial_capital: 10000
  # Copies of the TradingView settings, used when comparing with TradingView
  tradingview:
    commission_per_oz_per_side: 0.15   # commission_value in the Pine script
    qty_step: 0.1                      # sizes are floored to 0.1 oz on your chart
  # TradingView sends close_all at the close of the 17:00 bar, so it fills at the
  # 17:05 bar's open and stops/targets stay live 17:00-17:05.
  session_close_fill: next_bar_open   # or: session_end (exit at the 17:00 open)

calendar:
  tag_us_holidays: true       # US market holidays + early closes, column in the trade list
  skip_us_holidays: false     # switch on later to compare
  tag_dst_mismatch: true      # weeks when US data comes out at 12:30 UK

# Spreads above $5 are kept as real quotes; each trade records the widest
# spread it saw so spike-driven results are easy to spot.
