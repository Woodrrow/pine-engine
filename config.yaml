# =====================================================================
#  Gold intraday backtester - configuration
#  Stage 1 uses `data` + `quality`, Stage 2 uses `prepare`.
#  Strategy and report settings get added in later stages.
# =====================================================================

data:
  instrument: xauusd
  start_date: "2019-01-01"
  end_date: null              # null = today (UTC)

  raw_dir: data/raw           # yearly CSV chunks land in data/raw/<bid|ask>/<year>/
  processed_file: data/processed/xauusd_m1.parquet

  # dukascopy-node reports volume in "millions" by default, which gives tiny
  # numbers for gold (e.g. 0.0012). We ask for plain "units" so that the
  # later "if volume is 0 or missing, use 1" rule is a sensible fallback
  # rather than a weight thousands of times bigger than a normal bar.
  volume_units: units

  # Dukascopy reports separate bid-side and ask-side tick volume.
  # Which one becomes the single `volume` column used for VWAP:
  #   bid | ask | sum | mean
  volume_source: bid

  download_retries: 3         # per-file retries inside dukascopy-node
  chunk_attempts: 2           # whole-chunk attempts before giving up on a year

quality:
  report_timezone: Europe/London
  # Window we care most about (UK time). Missing minutes in here are reported per day.
  session_start: "13:00"
  session_end: "17:00"
  # Outside the session, only gaps at least this long are listed individually.
  large_gap_minutes: 30
  report_dir: reports

prepare:
  timezone: Europe/London
  bar_minutes: 5
  m5_file: data/processed/xauusd_m5.parquet

# ---------------------------------------------------------------------
#  Decisions recorded now, used from Stage 3/4 onwards
# ---------------------------------------------------------------------
execution:
  # realistic   - real bid/ask fills, 1-minute data decides stop vs target,
  #               position size capped at max_leverage x equity.
  # tradingview - copies TradingView's broker emulator, for Stage 5 validation:
  #               fills on the bid (chart) price + commission, guesses the path
  #               inside a 5-minute bar from its OHLC (no bar magnifier), no size
  #               cap: an over-margined entry from flat is rejected, a flip that
  #               reverses a position is filled then margin-called (4x shortfall).
  mode: realistic
  max_leverage: 20                  # 5% margin, FCA retail limit for gold
  commission_per_oz_per_side: 0.0   # tradingview mode uses 0.15 like the Pine script
  initial_capital: 10000
  # TradingView sends close_all at the close of the 17:00 bar, so it fills at the
  # 17:05 bar's open and stops/targets stay live 17:00-17:05.
  session_close_fill: next_bar_open   # or: session_end (exit at the 17:00 open)

calendar:
  tag_us_holidays: true       # US market holidays + early closes, column in the trade list
  skip_us_holidays: false     # switch on later to compare
  tag_dst_mismatch: true      # weeks when US data comes out at 12:30 UK

# Spreads above $5 are kept as real quotes; each trade records the widest
# spread it saw so spike-driven results are easy to spot.
